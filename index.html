<style>
/* ============================================================
   Money Nest ── お小遣い・貯金管理アプリ
   デザイン方針: Apple風 / ガラスモーフィズム / 白基調 + ブルーアクセント
   ============================================================ */

:root{
  --bg:#F4F7FB;
  --bg-grad-a:#EAF2FF;
  --bg-grad-b:#F7F5FF;
  --surface:255,255,255;
  --surface-alpha:0.62;
  --surface-border:255,255,255;
  --surface-border-alpha:0.75;
  --text-main:#0F1B2D;
  --text-sub:#6B7686;
  --text-faint:#9BA5B4;
  --accent:#0A84FF;
  --accent-2:#5E9CFF;
  --accent-soft:#E7F1FF;
  --income:#2FBE71;
  --income-soft:#E4F9EE;
  --expense:#FF5A5F;
  --warn:#FF9500;
  --shadow-color:220,232,255;
  --divider: rgba(15,27,45,0.08);
  --radius-lg:26px;
  --radius-md:18px;
  --radius-sm:12px;
}
html.dark{
  --bg:#0A0D14;
  --bg-grad-a:#0D1220;
  --bg-grad-b:#0A0D14;
  --surface:26,31,43;
  --surface-alpha:0.55;
  --surface-border:255,255,255;
  --surface-border-alpha:0.08;
  --text-main:#F2F5FA;
  --text-sub:#9AA4B6;
  --text-faint:#6B7383;
  --accent:#3B9DFF;
  --accent-2:#6FB4FF;
  --accent-soft:#132A47;
  --income:#3ED98A;
  --income-soft:#0F2A1E;
  --expense:#FF6B70;
  --warn:#FFB454;
  --shadow-color:0,0,0;
  --divider: rgba(255,255,255,0.08);
}

*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{height:100%;}
body{
  margin:0;
  font-family:'Noto Sans JP','Hiragino Sans','Hiragino Kaku Gothic ProN',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  color:var(--text-main);
  background:
    radial-gradient(1200px 800px at 100% -10%, var(--bg-grad-a), transparent 60%),
    radial-gradient(1000px 700px at -10% 110%, var(--bg-grad-b), transparent 55%),
    var(--bg);
  background-attachment:fixed;
  min-height:100vh;
  transition:background .4s ease, color .3s ease;
  -webkit-font-smoothing:antialiased;
  overscroll-behavior-y:none;
}
.num{ font-family:'Zen Kaku Gothic New','Noto Sans JP',sans-serif; font-feature-settings:"tnum"; letter-spacing:.01em; }
h1,h2,h3{ font-family:'Zen Kaku Gothic New','Noto Sans JP',sans-serif; margin:0; }
button{ font-family:inherit; }
::selection{ background:var(--accent); color:#fff; }

/* ---------- layout ---------- */
#app{ max-width:520px; margin:0 auto; min-height:100vh; padding-bottom:104px; position:relative; }
.hidden{ display:none !important; }
.page{ padding:0 18px; animation:fadeSlideUp .45s cubic-bezier(.19,1,.22,1); }
@keyframes fadeSlideUp{ from{opacity:0; transform:translateY(10px);} to{opacity:1; transform:translateY(0);} }

/* ---------- glass surfaces ---------- */
.glass{
  background:rgba(var(--surface), var(--surface-alpha));
  backdrop-filter:blur(22px) saturate(160%);
  -webkit-backdrop-filter:blur(22px) saturate(160%);
  border:1px solid rgba(var(--surface-border), var(--surface-border-alpha));
  border-radius:var(--radius-lg);
  box-shadow:0 8px 30px -8px rgba(var(--shadow-color),.35), inset 0 1px 0 rgba(255,255,255,.15);
}
.glass-sm{ border-radius:var(--radius-md); }

/* ---------- header ---------- */
.topbar{
  position:sticky; top:0; z-index:30;
  display:flex; align-items:center; justify-content:space-between;
  padding:18px 18px 10px;
  backdrop-filter:blur(14px);
  -webkit-backdrop-filter:blur(14px);
}
.brand{ display:flex; align-items:center; gap:9px; }
.brand-mark{
  width:34px; height:34px; border-radius:11px;
  overflow:hidden; flex:0 0 auto;
  box-shadow:0 6px 16px -4px rgba(10,132,255,.55);
}
.brand-mark img{ width:100%; height:100%; object-fit:cover; display:block; }
.brand-name{ font-weight:800; font-size:17px; letter-spacing:.02em; }
.icon-btn{
  width:38px; height:38px; border-radius:50%; border:none; cursor:pointer;
  display:flex; align-items:center; justify-content:center; font-size:17px;
  background:rgba(var(--surface), .55); border:1px solid rgba(var(--surface-border),.7);
  color:var(--text-main); transition:transform .15s ease, background .2s;
}
.icon-btn:active{ transform:scale(.9); }

/* ---------- hero / greeting card ---------- */
.hero-card{ padding:22px 22px 20px; margin-top:6px; position:relative; overflow:hidden; }
.hero-card::after{
  content:''; position:absolute; inset:0; pointer-events:none;
  background:linear-gradient(135deg, rgba(10,132,255,.10), transparent 55%);
}
.hero-greet{ font-size:13px; color:var(--text-sub); font-weight:500; }
.hero-name{ font-size:21px; font-weight:800; margin-top:2px; }
.hero-balance-label{ font-size:12.5px; color:var(--text-sub); margin-top:16px; font-weight:600; }
.hero-balance{ font-size:42px; font-weight:800; margin-top:2px; line-height:1.1; letter-spacing:-.01em; }
.hero-balance small{ font-size:19px; font-weight:700; margin-left:2px; color:var(--text-sub); }
.hero-sub-row{ display:flex; gap:10px; margin-top:16px; }
.hero-pill{
  flex:1; border-radius:16px; padding:10px 12px; background:rgba(var(--surface),.5);
  border:1px solid rgba(var(--surface-border),.6);
}
.hero-pill .l{ font-size:11px; color:var(--text-sub); font-weight:600; }
.hero-pill .v{ font-size:16px; font-weight:800; margin-top:3px; }
.hero-pill.expense .v{ color:var(--expense); }
.hero-pill.left .v{ color:var(--accent); }

/* grid of stat cards */
.grid2{ display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-top:14px; }
.stat-card{ padding:16px; }
.stat-card .l{ font-size:12px; color:var(--text-sub); font-weight:600; }
.stat-card .v{ font-size:20px; font-weight:800; margin-top:6px; }

/* ---------- goal card ---------- */
.goal-card{ padding:20px; margin-top:14px; }
.goal-top{ display:flex; align-items:flex-start; justify-content:space-between; }
.goal-title{ font-size:13px; color:var(--text-sub); font-weight:600; }
.goal-name{ font-size:18px; font-weight:800; margin-top:2px; }
.goal-pct{ font-size:22px; font-weight:800; color:var(--accent); }
.goal-bar-track{ height:12px; border-radius:99px; background:var(--divider); margin-top:14px; overflow:hidden; }
.goal-bar-fill{
  height:100%; border-radius:99px;
  background:linear-gradient(90deg, var(--accent), #7EC8FF);
  width:0%; transition:width 1.1s cubic-bezier(.19,1,.22,1);
  box-shadow:0 0 12px rgba(10,132,255,.5);
}
.goal-foot{ display:flex; justify-content:space-between; margin-top:10px; font-size:12.5px; color:var(--text-sub); font-weight:600; }
.sim-box{ margin-top:12px; padding:12px 14px; border-radius:14px; background:var(--accent-soft); color:var(--accent); font-size:13px; font-weight:700; display:flex; gap:8px; align-items:center; }
html.dark .sim-box{ color:var(--accent-2); }

/* ---------- section headers ---------- */
.section-head{ display:flex; align-items:center; justify-content:space-between; margin:26px 0 12px; }
.section-title{ font-size:16px; font-weight:800; }
.link-btn{ background:none; border:none; color:var(--accent); font-weight:700; font-size:13px; cursor:pointer; }

/* ---------- search ---------- */
.search-bar{ display:flex; align-items:center; gap:8px; padding:11px 15px; margin-bottom:12px; }
.search-bar input{ border:none; outline:none; background:transparent; flex:1; font-size:14px; color:var(--text-main); }
.search-bar input::placeholder{ color:var(--text-faint); }
.chip-row{ display:flex; gap:8px; overflow-x:auto; padding-bottom:4px; margin-bottom:12px; scrollbar-width:none; }
.chip-row::-webkit-scrollbar{ display:none; }
.chip{
  flex:0 0 auto; padding:7px 14px; border-radius:99px; font-size:12.5px; font-weight:700;
  background:rgba(var(--surface),.55); border:1px solid rgba(var(--surface-border),.7); color:var(--text-sub); cursor:pointer;
  transition:all .15s;
}
.chip.active{ background:var(--accent); color:#fff; border-color:var(--accent); }

/* ---------- transaction list ---------- */
.tx-item{ display:flex; align-items:center; gap:12px; padding:14px 16px; margin-bottom:10px; cursor:pointer; }
.tx-icon{ width:44px; height:44px; border-radius:14px; display:flex; align-items:center; justify-content:center; font-size:20px; flex:0 0 auto; background:var(--accent-soft); }
.tx-icon.income{ background:var(--income-soft); }
.tx-mid{ flex:1; min-width:0; }
.tx-cat{ font-size:14.5px; font-weight:700; }
.tx-memo{ font-size:12px; color:var(--text-sub); margin-top:2px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.tx-right{ text-align:right; flex:0 0 auto; }
.tx-amount{ font-size:15.5px; font-weight:800; }
.tx-amount.expense{ color:var(--expense); }
.tx-amount.income{ color:var(--income); }
.tx-date{ font-size:11px; color:var(--text-faint); margin-top:2px; }
.empty-state{ text-align:center; padding:50px 20px; color:var(--text-sub); }
.empty-state .em{ font-size:38px; margin-bottom:10px; }
.empty-state .t{ font-weight:700; font-size:14.5px; color:var(--text-main); }
.empty-state .s{ font-size:12.5px; margin-top:4px; }

/* ---------- calendar ---------- */
.cal-head{ display:flex; align-items:center; justify-content:space-between; padding:6px 4px 14px; }
.cal-head .m{ font-size:16px; font-weight:800; }
.cal-grid{ display:grid; grid-template-columns:repeat(7,1fr); gap:4px; text-align:center; }
.cal-dow{ font-size:11px; color:var(--text-faint); font-weight:700; padding-bottom:6px; }
.cal-day{
  aspect-ratio:1; display:flex; flex-direction:column; align-items:center; justify-content:center;
  border-radius:12px; font-size:12.5px; font-weight:600; cursor:pointer; position:relative; color:var(--text-main);
  transition:background .15s;
}
.cal-day.pad{ visibility:hidden; }
.cal-day:hover{ background:rgba(var(--surface),.5); }
.cal-day.today{ border:1.5px solid var(--accent); }
.cal-day.selected{ background:var(--accent); color:#fff; }
.cal-dot{ width:5px; height:5px; border-radius:50%; background:var(--expense); margin-top:3px; }
.cal-day.selected .cal-dot{ background:#fff; }

/* ---------- charts / stats ---------- */
.chart-card{ padding:18px; margin-bottom:16px; }
.chart-card .ct{ font-size:13.5px; font-weight:800; margin-bottom:12px; }
.chart-wrap{ position:relative; height:220px; }
.stat-list{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }
.stat-tile{ padding:14px; }
.stat-tile .l{ font-size:11.5px; color:var(--text-sub); font-weight:600; }
.stat-tile .v{ font-size:16.5px; font-weight:800; margin-top:5px; }

/* ---------- settings ---------- */
.settings-group{ margin-bottom:22px; }
.settings-group .gt{ font-size:12px; font-weight:800; color:var(--text-sub); margin:0 6px 8px; letter-spacing:.03em; }
.update-item{ padding:14px 16px; }
.update-item + .update-item{ border-top:1px solid var(--divider); }
.update-top{ display:flex; align-items:center; gap:8px; }
.update-badge{ font-size:11px; font-weight:800; color:var(--accent); background:var(--accent-soft); padding:2px 9px; border-radius:99px; }
.update-date{ font-size:11.5px; color:var(--text-faint); font-weight:600; }
.update-notes{ margin:8px 0 0; padding-left:18px; }
.update-notes li{ font-size:12.5px; color:var(--text-sub); line-height:1.6; }
.update-notes li + li{ margin-top:2px; }
.faq-empty{ text-align:center; padding:16px 10px 8px; }
.faq-empty-title{ font-size:16px; font-weight:800; margin-top:8px; }
.faq-empty-sub{ font-size:12.5px; color:var(--text-sub); margin-top:8px; line-height:1.7; }
.settings-row{ display:flex; align-items:center; justify-content:space-between; padding:15px 16px; }
.settings-row + .settings-row{ border-top:1px solid var(--divider); }
.settings-row .label{ font-size:14.5px; font-weight:600; }
.settings-row .desc{ font-size:11.5px; color:var(--text-sub); margin-top:2px; }
.settings-row.link{ cursor:pointer; }
.contact-option{ display:flex; align-items:center; gap:14px; padding:16px; margin-bottom:10px; cursor:pointer; transition:transform .12s; }
.contact-option:active{ transform:scale(.98); }
.contact-option .ico{ font-size:26px; flex:0 0 auto; width:44px; height:44px; border-radius:14px; background:var(--accent-soft); display:flex; align-items:center; justify-content:center; }
.contact-option .mid{ flex:1; min-width:0; }
.contact-option .mid .t{ font-size:14.5px; font-weight:800; }
.contact-option .mid .d{ font-size:12px; color:var(--text-sub); margin-top:2px; }
.contact-back{ display:flex; align-items:center; gap:5px; background:none; border:none; color:var(--accent); font-weight:700; font-size:13px; cursor:pointer; padding:0 0 14px; }
.settings-row.danger .label{ color:var(--expense); }
.field{ margin-bottom:16px; }
.field label{ display:block; font-size:12.5px; font-weight:700; color:var(--text-sub); margin-bottom:7px; }
.field input, .field select, .field textarea{
  width:100%; padding:13px 14px; border-radius:14px; border:1px solid var(--divider);
  background:rgba(var(--surface),.5); color:var(--text-main); font-size:15px; outline:none;
  transition:border-color .15s; font-family:inherit;
}
.field textarea{ resize:vertical; min-height:70px; }
.field input:focus, .field select:focus, .field textarea:focus{ border-color:var(--accent); }

/* toggle switch */
.switch{ position:relative; width:48px; height:28px; flex:0 0 auto; }
.switch input{ opacity:0; width:0; height:0; }
.switch .track{ position:absolute; inset:0; background:var(--divider); border-radius:99px; cursor:pointer; transition:.25s; }
.switch .track::before{ content:''; position:absolute; width:22px; height:22px; left:3px; top:3px; background:#fff; border-radius:50%; transition:.25s; box-shadow:0 2px 6px rgba(0,0,0,.2); }
.switch input:checked + .track{ background:var(--accent); }
.switch input:checked + .track::before{ transform:translateX(20px); }

/* ---------- buttons ---------- */
.btn{ border:none; border-radius:16px; padding:15px; font-size:15px; font-weight:700; cursor:pointer; width:100%; transition:transform .12s, filter .15s; }
.btn:active{ transform:scale(.97); }
.btn-primary{ background:var(--accent); color:#fff; box-shadow:0 8px 20px -6px rgba(10,132,255,.55); }
.btn-secondary{ background:rgba(var(--surface),.6); color:var(--text-main); border:1px solid var(--divider); }
.btn-danger{ background:transparent; color:var(--expense); border:1px solid rgba(255,90,95,.4); }
.btn-ghost{ background:transparent; color:var(--text-sub); }
.seg{ display:flex; background:rgba(var(--surface),.5); border:1px solid var(--divider); border-radius:14px; padding:4px; }
.seg button{ flex:1; border:none; background:transparent; padding:10px; border-radius:11px; font-weight:700; font-size:13.5px; color:var(--text-sub); cursor:pointer; transition:.2s; }
.seg button.active{ background:var(--accent); color:#fff; }
.cat-grid{ display:grid; grid-template-columns:repeat(3,1fr); gap:8px; }
.cat-opt{ padding:12px 4px; border-radius:14px; text-align:center; cursor:pointer; border:1.5px solid transparent; background:rgba(var(--surface),.5); transition:.15s; }
.cat-opt .ic{ font-size:20px; }
.cat-opt .lb{ font-size:11px; font-weight:700; margin-top:4px; }
.cat-opt.active{ border-color:var(--accent); background:var(--accent-soft); }

/* ---------- bottom nav ---------- */
.bottom-nav{
  position:fixed; left:50%; bottom:16px; transform:translateX(-50%); z-index:40;
  width:calc(100% - 32px); max-width:488px;
  display:flex; justify-content:space-around; align-items:center;
  padding:8px; border-radius:24px;
}
.nav-btn{ background:none; border:none; display:flex; flex-direction:column; align-items:center; gap:3px; padding:8px 14px; border-radius:16px; cursor:pointer; color:var(--text-faint); transition:.2s; }
.nav-btn .ic{ font-size:19px; }
.nav-btn .lb{ font-size:10px; font-weight:700; }
.nav-btn.active{ color:var(--accent); }
.fab{
  position:fixed; right:20px; bottom:88px; z-index:41;
  width:60px; height:60px; border-radius:50%; border:none; cursor:pointer;
  background:linear-gradient(150deg, var(--accent), #4FB0FF); color:#fff; font-size:26px; font-weight:400;
  display:flex; align-items:center; justify-content:center;
  box-shadow:0 12px 26px -6px rgba(10,132,255,.65);
  transition:transform .15s;
}
.fab:active{ transform:scale(.9) rotate(90deg); }

/* ---------- modal / overlay ---------- */
.overlay{
  position:fixed; inset:0; z-index:100; display:flex; align-items:flex-end; justify-content:center;
  background:rgba(6,10,20,.45); backdrop-filter:blur(4px); animation:fadeIn .2s ease;
}
.overlay.center{ align-items:center; padding:20px; }
@keyframes fadeIn{ from{opacity:0;} to{opacity:1;} }
.sheet{
  width:100%; max-width:520px; max-height:88vh; overflow-y:auto;
  background:rgba(var(--surface), .96); backdrop-filter:blur(24px);
  border-radius:28px 28px 0 0; padding:10px 20px 28px;
  animation:sheetUp .35s cubic-bezier(.19,1,.22,1);
  border:1px solid rgba(var(--surface-border),.5); border-bottom:none;
}
.overlay.center .sheet{ border-radius:26px; border-bottom:1px solid rgba(var(--surface-border),.5); max-height:80vh; animation:popIn .25s cubic-bezier(.19,1,.22,1); }
@keyframes sheetUp{ from{transform:translateY(60px); opacity:0;} to{transform:translateY(0); opacity:1;} }
@keyframes popIn{ from{transform:scale(.92); opacity:0;} to{transform:scale(1); opacity:1;} }
.sheet-handle{ width:38px; height:5px; background:var(--divider); border-radius:99px; margin:8px auto 14px; }
.sheet-title{ font-size:18px; font-weight:800; margin-bottom:18px; text-align:center; }
.wizard-dots{ display:flex; justify-content:center; gap:6px; margin:-8px 0 18px; }
.wizard-dots .dot{ width:7px; height:7px; border-radius:99px; background:var(--divider); transition:.25s; }
.wizard-dots .dot.active{ background:var(--accent); width:20px; }
.wizard-dots .dot.done{ background:var(--accent-2); }
.sheet-title-row{ display:flex; align-items:center; justify-content:space-between; margin-bottom:18px; position:relative; }
.sheet-title-row .sheet-title{ flex:1; text-align:center; }
.sheet-title-row .icon-btn{ position:absolute; right:20px; }

/* ---------- toast ---------- */
.toast-wrap{ position:fixed; top:14px; left:50%; transform:translateX(-50%); z-index:200; display:flex; flex-direction:column; gap:8px; width:calc(100% - 32px); max-width:480px; pointer-events:none; }
.toast{
  padding:13px 16px; border-radius:16px; font-size:13px; font-weight:700; display:flex; align-items:center; gap:9px;
  animation:toastIn .3s cubic-bezier(.19,1,.22,1);
  box-shadow:0 10px 28px -8px rgba(0,0,0,.25);
}
@keyframes toastIn{ from{opacity:0; transform:translateY(-14px) scale(.96);} to{opacity:1; transform:translateY(0) scale(1);} }
.toast.warn{ background:#FFF4E5; color:#9A5B00; }
.toast.danger{ background:#FFE9EA; color:#B3231F; }
.toast.success{ background:#E4F9EE; color:#137A41; }
.toast.info{ background:var(--accent-soft); color:var(--accent); }
html.dark .toast.warn{ background:#3A2900; color:#FFC876; }
html.dark .toast.danger{ background:#3A1517; color:#FF9A9D; }
html.dark .toast.success{ background:#0F2A1E; color:#5BE79B; }

/* ---------- achievement popup ---------- */
.achieve-box{ text-align:center; padding:36px 24px; }
.achieve-emoji{ font-size:56px; animation:pop .6s cubic-bezier(.34,1.56,.64,1); }
@keyframes pop{ 0%{transform:scale(0);} 60%{transform:scale(1.15);} 100%{transform:scale(1);} }
.achieve-title{ font-size:20px; font-weight:800; margin-top:14px; }
.achieve-sub{ font-size:14px; color:var(--text-sub); margin-top:6px; }

/* cookie banner */
.cookie-banner{ position:fixed; right:16px; bottom:16px; left:16px; max-width:400px; margin-left:auto; z-index:150; padding:18px; animation:fadeSlideUp .4s; }
.cookie-banner p{ font-size:13px; color:var(--text-sub); line-height:1.6; margin:0 0 14px; }
.cookie-banner .row{ display:flex; gap:8px; }

/* history */
.hist-item{ padding:16px; margin-bottom:10px; display:flex; align-items:center; justify-content:space-between; }
.hist-month{ font-size:15px; font-weight:800; }
.hist-sub{ font-size:12px; color:var(--text-sub); margin-top:4px; }
.hist-saved{ text-align:right; }
.hist-saved .v{ font-size:16px; font-weight:800; color:var(--income); }

@media (min-width:600px){
  .bottom-nav{ max-width:520px; }
}
@media (prefers-reduced-motion: reduce){
  *{ animation-duration:.001s !important; transition-duration:.001s !important; }
}
</style>
</head>

<script>
/* ============================================================
   Money Nest ── お小遣い・貯金管理アプリ ロジック
   すべてのデータは LocalStorage に保存されます（Cookie同意時のみ）
   ============================================================ */
(function(){
"use strict";

/* ---------- 定数 ---------- */
const LS_PREFIX = "pocket_";
const KEYS = {
  consent: LS_PREFIX+"consent",
  settings: LS_PREFIX+"settings",
  tx: LS_PREFIX+"transactions",
  history: LS_PREFIX+"history",
  meta: LS_PREFIX+"meta" // currentMonth, totalSavings, notified flags
};

const EXPENSE_CATS = [
  {id:"food", label:"食べ物", icon:"🍙"},
  {id:"drink", label:"飲み物", icon:"🥤"},
  {id:"play", label:"遊び", icon:"🎡"},
  {id:"game", label:"ゲーム", icon:"🎮"},
  {id:"shopping", label:"買い物", icon:"🛍️"},
  {id:"hobby", label:"趣味", icon:"🎨"},
  {id:"transport", label:"交通費", icon:"🚃"},
  {id:"school", label:"学校", icon:"🏫"},
  {id:"other", label:"その他", icon:"📦"},
];
const INCOME_CATS = [
  {id:"allowance", label:"お小遣い", icon:"💰"},
  {id:"parttime", label:"アルバイト", icon:"💼"},
  {id:"otoshidama", label:"お年玉", icon:"🧧"},
  {id:"bonus", label:"臨時収入", icon:"🎁"},
  {id:"other", label:"その他", icon:"📥"},
];
const DOW = ["日","月","火","水","木","金","土"];

// サイトの更新情報（新しい順）。設定画面の「更新情報」に表示されます。
const CHANGELOG = [
  { version:"1.0", date:"2026-08-04", notes:[
    "支出・収入の記録機能（金額・カテゴリ・メモ・日付を3秒で入力）",
    "ホーム画面に残高・今月の支出・貯金目標の進捗をガラス風カードで表示",
    "検索・カテゴリ絞り込みに対応した履歴一覧",
    "カレンダー表示（記録がある日をマーク、日別詳細を確認可能）",
    "カテゴリ別・日別・月別のグラフと収支比較グラフ（Chart.js）",
    "総支出・平均支出・最大/最小支出などの統計表示",
    "貯金目標の進捗バーとシミュレーション（達成予測メッセージ）",
    "目標達成時のお祝いアニメーション（紙吹雪）",
    "月が変わったときの自動リセット確認と月次履歴の保存",
    "残高が20%・10%・0%以下になったときの通知",
    "ダークモード対応",
    "レシート画像をAIが読み取り、金額・カテゴリ・日付を自動入力する機能",
    "設定画面からCookieの許可・拒否をあとから変更できる機能",
    "データのエクスポート／インポート、CSV出力、全データ削除機能",
    "PWA対応（ホーム画面への追加・オフライン起動）",
    "アプリ名を「Money Nest」に設定し、専用アイコンを適用",
    "毎月の貯金目標機能を追加（今月の貯金額と目標を比較して達成率を表示）",
    "毎月のお小遣い自動入金機能を追加（設定した日に自動で収入登録・重複防止つき）",
    "設定画面から「アプリを最新の状態に更新」できるボタンを追加",
    "お問い合わせ・機能追加リクエスト・不具合報告の3種類のフォームを追加（Googleスプレッドシートへ自動記録）",
    "設定画面に「よくある質問」を追加（現在作成中）",
  ]},
];

/* ---------- state ---------- */
let settings = null;      // {name, monthlyAllowance, goalAmount, goalName, darkMode}
let txs = [];              // transactions array
let history = [];          // monthly history array
let meta = null;           // {currentMonth, totalSavings, notified:{20,10,0,goal}}
let currentTab = "home";
let editingCategoryType = "expense"; // for tx modal
let selectedCatId = null;
let calMonthOffset = 0;    // 0 = this month
let calSelectedDate = null;
let searchQuery = "";
let filterCat = "all";
let listView = "list"; // 'list' | 'calendar'
let charts = {};
let cookieConsent = null; // 'granted' | 'denied' | null

/* ---------- utils ---------- */
const $ = (sel, root) => (root||document).querySelector(sel);
const $$ = (sel, root) => Array.from((root||document).querySelectorAll(sel));
const yen = (n) => (Math.round(n||0)).toLocaleString('ja-JP');
const todayStr = () => fmtDate(new Date());
function fmtDate(d){ const y=d.getFullYear(), m=String(d.getMonth()+1).padStart(2,'0'), day=String(d.getDate()).padStart(2,'0'); return `${y}-${m}-${day}`; }
function monthKey(dateStr){ return dateStr.slice(0,7); }
function thisMonthKey(){ return monthKey(todayStr()); }
function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,7); }
function catInfo(type, id){ const list = type==='expense'?EXPENSE_CATS:INCOME_CATS; return list.find(c=>c.id===id) || list[list.length-1]; }
function escapeHtml(s){ return (s||"").replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }

function save(key, val){
  if(cookieConsent !== "granted") return; // Cookieが許可されていない場合はLocalStorageへ保存しない
  try{ localStorage.setItem(key, JSON.stringify(val)); }catch(e){ console.error("保存エラー", e); toast("保存できませんでした", "danger"); }
}
function load(key, fallback){ try{ const v = localStorage.getItem(key); return v ? JSON.parse(v) : fallback; }catch(e){ return fallback; } }

/* ================= Cookie 同意 ================= */
function initConsent(){
  const consent = localStorage.getItem(KEYS.consent);
  cookieConsent = consent === "granted" || consent === "denied" ? consent : null;
  if(consent === "granted"){ boot(); return; }
  if(consent === "denied"){ bootNoStorage(); return; }
  $("#cookieBanner").classList.remove("hidden");
}
$("#cookieAllow").addEventListener("click", ()=>{
  cookieConsent = "granted";
  localStorage.setItem(KEYS.consent, "granted");
  $("#cookieBanner").classList.add("hidden");
  boot();
});
$("#cookieDeny").addEventListener("click", ()=>{
  cookieConsent = "denied";
  localStorage.setItem(KEYS.consent, "denied");
  $("#cookieBanner").classList.add("hidden");
  bootNoStorage();
});
function bootNoStorage(){
  toast("データは保存されません（拒否を選択しました）", "warn");
  settings = defaultSettings();
  txs = []; history = []; meta = defaultMeta();
  renderAll();
  $("#onboardModal").classList.remove("hidden");
  startOnboardWizard();
}

/* ================= 初期データ ================= */
function defaultSettings(){
  return {
    name:"", monthlyAllowance:0, goalAmount:0, goalName:"", darkMode:false,
    // 毎月の貯金目標
    monthlyGoalEnabled:false, monthlyGoalAmount:0,
    // 毎月のお小遣い自動入金
    autoAllowanceEnabled:false, autoAllowanceAmount:0, autoAllowanceDay:1,
  };
}
function defaultMeta(){ return {currentMonth: thisMonthKey(), totalSavings:0, notified:{"20":false,"10":false,"0":false,"goal":false}, lastAutoAllowanceMonth:null}; }

function boot(){
  const loadedSettings = load(KEYS.settings, null);
  // 既存ユーザーの設定にも新機能の項目が確実に存在するようにマージ
  settings = loadedSettings ? {...defaultSettings(), ...loadedSettings} : null;
  txs = load(KEYS.tx, []);
  history = load(KEYS.history, []);
  meta = {...defaultMeta(), ...load(KEYS.meta, {})};

  applyDarkMode();

  if(!settings){
    settings = defaultSettings();
    $("#onboardModal").classList.remove("hidden");
    startOnboardWizard();
  } else {
    checkMonthRollover();
    checkAutoAllowance();
  }
  renderAll();
}

/* ================= 初期設定ウィザード ================= */
const ONBOARD_STEPS = ["profile", "autoAllowance", "monthlyGoal"];
let onboardStepIdx = 0;
// ウィザード内で入力中の値を一時保持
let onboardDraft = {};

function startOnboardWizard(){
  onboardStepIdx = 0;
  onboardDraft = {
    name:"", monthlyAllowance:0, goalAmount:0, goalName:"",
    autoAllowanceEnabled:false, autoAllowanceAmount:0, autoAllowanceDay:1,
    monthlyGoalEnabled:false, monthlyGoalAmount:0,
  };
  renderOnboardStep();
}
function renderOnboardDots(){
  $("#onboardDots").innerHTML = ONBOARD_STEPS.map((_,i)=>
    `<span class="dot ${i===onboardStepIdx?'active':(i<onboardStepIdx?'done':'')}"></span>`
  ).join("");
}
function renderOnboardStep(){
  renderOnboardDots();
  $("#onboardConfirmMsg").classList.add("hidden");
  $("#onboardBackBtn").classList.toggle("hidden", onboardStepIdx===0);
  const step = ONBOARD_STEPS[onboardStepIdx];
  const isLast = onboardStepIdx === ONBOARD_STEPS.length-1;
  $("#onboardNextBtn").textContent = isLast ? "はじめる" : "つぎへ";

  if(step === "profile"){
    $("#onboardEmoji").textContent = "🐷";
    $("#onboardStepTitle").innerHTML = `はじめまして！<br><span style="font-size:14px; font-weight:600; color:var(--text-sub);">かんたん初期設定をしましょう</span>`;
    $("#onboardForm").innerHTML = `
      <div class="field"><label>あなたの名前</label><input id="ob_name" type="text" placeholder="例：はなこ" maxlength="20" value="${escapeHtml(onboardDraft.name)}"></div>
      <div class="field"><label>今月のお小遣い金額</label><input id="ob_allowance" type="number" inputmode="numeric" placeholder="例：5000" min="0" value="${onboardDraft.monthlyAllowance||''}"></div>
      <div class="field"><label>貯金の目標金額</label><input id="ob_goalAmount" type="number" inputmode="numeric" placeholder="例：20000" min="0" value="${onboardDraft.goalAmount||''}"></div>
      <div class="field"><label>目標名</label><input id="ob_goalName" type="text" placeholder="例：Switch 2・旅行・イヤホンなど" maxlength="24" value="${escapeHtml(onboardDraft.goalName)}"></div>
    `;
  } else if(step === "autoAllowance"){
    $("#onboardEmoji").textContent = "💴";
    $("#onboardStepTitle").innerHTML = `毎月のお小遣い<br><span style="font-size:14px; font-weight:600; color:var(--text-sub);">自動入金を設定しましょう</span>`;
    const dayOptions = Array.from({length:31},(_,i)=>i+1).map(d=>`<option value="${d}" ${onboardDraft.autoAllowanceDay===d?'selected':''}>${d}日</option>`).join("");
    $("#onboardForm").innerHTML = `
      <div class="glass glass-sm settings-row" style="padding:14px 16px; margin-bottom:16px;">
        <div><div class="label">自動入金を利用する</div><div class="desc">設定した日に毎月自動でお小遣いを記録します</div></div>
        <label class="switch"><input type="checkbox" id="ob_autoEnabled" ${onboardDraft.autoAllowanceEnabled?'checked':''}><span class="track"></span></label>
      </div>
      <div class="field"><label>毎月のお小遣い金額</label><input id="ob_autoAmount" type="number" inputmode="numeric" placeholder="例：3000" min="0" value="${onboardDraft.autoAllowanceAmount||''}"></div>
      <div class="field"><label>受け取る日（毎月）</label><select id="ob_autoDay">${dayOptions}</select></div>
    `;
  } else if(step === "monthlyGoal"){
    $("#onboardEmoji").textContent = "🎯";
    $("#onboardStepTitle").innerHTML = `毎月の貯金目標<br><span style="font-size:14px; font-weight:600; color:var(--text-sub);">目標金額を設定しましょう</span>`;
    $("#onboardForm").innerHTML = `
      <div class="glass glass-sm settings-row" style="padding:14px 16px; margin-bottom:16px;">
        <div><div class="label">毎月の貯金目標を利用する</div><div class="desc">毎月いくら貯金するか目標を決めて管理します</div></div>
        <label class="switch"><input type="checkbox" id="ob_goalEnabled" ${onboardDraft.monthlyGoalEnabled?'checked':''}><span class="track"></span></label>
      </div>
      <div class="field"><label>毎月の貯金目標金額</label><input id="ob_monthlyGoalAmount" type="number" inputmode="numeric" placeholder="例：2000" min="0" value="${onboardDraft.monthlyGoalAmount||''}"></div>
    `;
  }
}
function collectOnboardStep(){
  const step = ONBOARD_STEPS[onboardStepIdx];
  if(step === "profile"){
    onboardDraft.name = $("#ob_name").value.trim();
    onboardDraft.monthlyAllowance = Math.max(0, Number($("#ob_allowance").value)||0);
    onboardDraft.goalAmount = Math.max(0, Number($("#ob_goalAmount").value)||0);
    onboardDraft.goalName = $("#ob_goalName").value.trim();
  } else if(step === "autoAllowance"){
    onboardDraft.autoAllowanceEnabled = $("#ob_autoEnabled").checked;
    onboardDraft.autoAllowanceAmount = Math.max(0, Number($("#ob_autoAmount").value)||0);
    onboardDraft.autoAllowanceDay = Number($("#ob_autoDay").value)||1;
  } else if(step === "monthlyGoal"){
    onboardDraft.monthlyGoalEnabled = $("#ob_goalEnabled").checked;
    onboardDraft.monthlyGoalAmount = Math.max(0, Number($("#ob_monthlyGoalAmount").value)||0);
  }
}
$("#onboardBackBtn").addEventListener("click", ()=>{
  collectOnboardStep();
  onboardStepIdx = Math.max(0, onboardStepIdx-1);
  renderOnboardStep();
});
$("#onboardNextBtn").addEventListener("click", ()=>{
  collectOnboardStep();
  const step = ONBOARD_STEPS[onboardStepIdx];
  const isLast = onboardStepIdx === ONBOARD_STEPS.length-1;

  // 各ステップの完了メッセージを一瞬表示してから次へ
  let msg = "";
  if(step === "autoAllowance"){
    msg = onboardDraft.autoAllowanceEnabled
      ? `毎月${onboardDraft.autoAllowanceDay}日に${yen(onboardDraft.autoAllowanceAmount)}円がお小遣いとして自動登録されます。`
      : "自動入金は利用しません。";
  } else if(step === "monthlyGoal"){
    msg = onboardDraft.monthlyGoalEnabled
      ? `毎月${yen(onboardDraft.monthlyGoalAmount)}円を目標に貯金します。`
      : "毎月の貯金目標は利用しません。";
  }

  if(!isLast){
    if(msg){
      $("#onboardConfirmMsg").textContent = "✅ " + msg;
      $("#onboardConfirmMsg").classList.remove("hidden");
      setTimeout(()=>{ onboardStepIdx++; renderOnboardStep(); }, 700);
    } else {
      onboardStepIdx++; renderOnboardStep();
    }
    return;
  }

  // 最終ステップ：すべて保存してアプリを開始
  if(msg){
    $("#onboardConfirmMsg").textContent = "✅ " + msg;
    $("#onboardConfirmMsg").classList.remove("hidden");
  }
  settings = {
    name: onboardDraft.name || "あなた",
    monthlyAllowance: onboardDraft.monthlyAllowance,
    goalAmount: onboardDraft.goalAmount,
    goalName: onboardDraft.goalName || "貯金目標",
    darkMode:false,
    monthlyGoalEnabled: onboardDraft.monthlyGoalEnabled,
    monthlyGoalAmount: onboardDraft.monthlyGoalAmount,
    autoAllowanceEnabled: onboardDraft.autoAllowanceEnabled,
    autoAllowanceAmount: onboardDraft.autoAllowanceAmount,
    autoAllowanceDay: onboardDraft.autoAllowanceDay,
  };
  meta = defaultMeta();
  save(KEYS.settings, settings);
  save(KEYS.meta, meta);
  save(KEYS.tx, txs);
  save(KEYS.history, history);
  setTimeout(()=>{

function checkMonthRollover(){
  if(meta.currentMonth !== thisMonthKey()){
    $("#rolloverText").textContent = `${meta.currentMonth.replace('-','年')}月のお小遣いをリセットしますか？`;
    $("#rolloverModal").classList.remove("hidden");
  }
}
$("#rolloverLater").addEventListener("click", ()=> $("#rolloverModal").classList.add("hidden"));
$("#rolloverConfirm").addEventListener("click", ()=>{
  archiveMonth(meta.currentMonth);
  meta.currentMonth = thisMonthKey();
  meta.notified = {"20":false,"10":false,"0":false,"goal":meta.notified.goal};
  save(KEYS.meta, meta);
  $("#rolloverModal").classList.add("hidden");
  toast("今月分をリセットしました", "success");
  checkAutoAllowance();
  renderAll();
});
function archiveMonth(mKey){
  const monthTx = txs.filter(t=>monthKey(t.date)===mKey);
  const totalExpense = monthTx.filter(t=>t.type==='expense').reduce((s,t)=>s+t.amount,0);
  const totalIncome = monthTx.filter(t=>t.type==='income').reduce((s,t)=>s+t.amount,0);
  const saved = Math.max(0, settings.monthlyAllowance + totalIncome - totalExpense);
  meta.totalSavings = (meta.totalSavings||0) + saved;
  const achievedGoal = settings.goalAmount>0 && meta.totalSavings >= settings.goalAmount && !history.some(h=>h.goalAchieved);
  history.unshift({month:mKey, totalExpense, totalIncome, saved, goalAchieved: achievedGoal ? settings.goalName : null});
  save(KEYS.history, history);
  save(KEYS.meta, meta);
}

/* ================= 毎月のお小遣い自動入金 ================= */
// 設定した受取日を過ぎていて、今月まだ実行していなければ自動で収入を1件登録する。
// 何度アプリを起動しても、同じ月には1回しか実行されない。
function checkAutoAllowance(){
  if(!settings.autoAllowanceEnabled) return;
  if(!settings.autoAllowanceAmount || settings.autoAllowanceAmount<=0) return;
  if(meta.lastAutoAllowanceMonth === thisMonthKey()) return;

  const now = new Date();
  const lastDayOfMonth = new Date(now.getFullYear(), now.getMonth()+1, 0).getDate();
  const targetDay = Math.min(Math.max(1, settings.autoAllowanceDay||1), lastDayOfMonth);
  if(now.getDate() < targetDay) return; // まだ受取日になっていない

  const dateStr = `${thisMonthKey()}-${String(targetDay).padStart(2,'0')}`;
  txs.push({
    id:uid(), type:'income', amount:Math.round(settings.autoAllowanceAmount),
    category:'allowance', memo:'毎月のお小遣い', date:dateStr,
    createdAt:Date.now().toString(), auto:true
  });
  save(KEYS.tx, txs);
  meta.lastAutoAllowanceMonth = thisMonthKey();
  save(KEYS.meta, meta);
  toast(`毎月のお小遣い ${yen(settings.autoAllowanceAmount)}円 を自動入金しました🎉`, "success");
}

/* ================= トースト通知 ================= */
function toast(msg, type="info", ms=3200){
  const el = document.createElement("div");
  el.className = `toast ${type}`;
  const icons = {info:"ℹ️", success:"✅", warn:"⚠️", danger:"🚨"};
  el.innerHTML = `<span>${icons[type]||""}</span><span>${escapeHtml(msg)}</span>`;
  $("#toastWrap").appendChild(el);
  setTimeout(()=>{ el.style.transition="opacity .3s, transform .3s"; el.style.opacity="0"; el.style.transform="translateY(-10px)"; setTimeout(()=>el.remove(),300); }, ms);
}

/* ================= 集計ヘルパー ================= */
function monthTxs(mKey){ return txs.filter(t=>monthKey(t.date)===mKey); }
function currentMonthTxs(){ return monthTxs(thisMonthKey()); }
function currentBalance(){
  const mt = currentMonthTxs();
  const income = mt.filter(t=>t.type==='income').reduce((s,t)=>s+t.amount,0);
  const expense = mt.filter(t=>t.type==='expense').reduce((s,t)=>s+t.amount,0);
  return settings.monthlyAllowance + income - expense;
}
function currentMonthExpense(){ return currentMonthTxs().filter(t=>t.type==='expense').reduce((s,t)=>s+t.amount,0); }
function currentMonthIncomeExtra(){ return currentMonthTxs().filter(t=>t.type==='income').reduce((s,t)=>s+t.amount,0); }
function projectedSavings(){
  // 現在のペースで月末までいくら貯まりそうか（単純: 現在残高がそのまま貯金に回るなら）
  return Math.max(0, currentBalance());
}
function totalSavingsWithCurrent(){
  return (meta.totalSavings||0) + projectedSavings();
}

/* ================= 通知しきい値チェック ================= */
function checkBalanceNotifications(){
  const allowance = settings.monthlyAllowance || 0;
  if(allowance <= 0) return;
  const bal = currentBalance();
  const pct = bal/allowance*100;
  if(bal <= 0 && !meta.notified["0"]){
    toast("残高が0円以下になりました", "danger"); meta.notified["0"]=true; meta.notified["10"]=true; meta.notified["20"]=true;
  } else if(pct <= 10 && !meta.notified["10"]){
    toast("残高が10%以下になりました", "danger"); meta.notified["10"]=true; meta.notified["20"]=true;
  } else if(pct <= 20 && !meta.notified["20"]){
    toast("残高が20%以下になりました", "warn"); meta.notified["20"]=true;
  }
  save(KEYS.meta, meta);
}
function checkGoalAchievement(){
  if(settings.goalAmount>0 && totalSavingsWithCurrent() >= settings.goalAmount && !meta.notified.goal){
    meta.notified.goal = true;
    save(KEYS.meta, meta);
    showAchievement();
  }
}

function renderTxListView(){

  body.innerHTML = `

function uniqueChips(cats){
  const seen = new Set(); const out=[];
  cats.forEach(c=>{ if(!seen.has(c.id)){ seen.add(c.id); out.push(c); } });
  return out;
}
function renderFilteredTxList(){
  let list = [...txs];
  if(filterCat!=='all') list = list.filter(t=>t.category===filterCat);
  if(searchQuery.trim()){
    const q = searchQuery.trim().toLowerCase();
    list = list.filter(t=>{
      const cat = catInfo(t.type, t.category);
      return (cat.label.toLowerCase().includes(q)) ||
             ((t.memo||"").toLowerCase().includes(q)) ||
             (String(t.amount).includes(q)) ||
             (t.date.includes(q));
    });
  }
  list.sort((a,b)=> (b.date+b.createdAt).localeCompare(a.date+a.createdAt));
  const el = $("#txListItems");
  el.innerHTML = list.length ? list.map(renderTxItem).join("") : emptyState("🔍","記録が見つかりません","条件を変えて検索してみてください");
  bindTxItemClicks(el);
}
function renderTxItem(t){
  const cat = catInfo(t.type, t.category);
  const label = t.type==='expense' ? cat.label : cat.label;
  const memo = t.type==='expense' ? (t.memo||"") : (t.memo||"");
  return `
  <div class="glass tx-item" data-id="${t.id}">
    <div class="tx-icon ${t.type==='income'?'income':''}">${cat.icon}</div>
    <div class="tx-mid">
      <div class="tx-cat">${escapeHtml(label)}</div>
      ${memo?`<div class="tx-memo">${escapeHtml(memo)}</div>`:""}
    </div>

      <div class="tx-amount ${t.type}">${t.type==='expense'?'-':'+'}${yen(t.amount)}円</div>
      <div class="tx-date">${t.date.slice(5).replace('-','/')}</div>
    </div>
  </div>`;
}

function renderCalendarView(){

  const viewDate = new Date(now.getFullYear(), now.getMonth()+calMonthOffset, 1);
  const y = viewDate.getFullYear(), m = viewDate.getMonth();

  const daysInMonth = new Date(y,m+1,0).getDate();

  const dayHasTx = new Set(txs.filter(t=>monthKey(t.date)===mKeyView).map(t=>t.date));

  let cells = "";
  for(let i=0;i<firstDow;i++) cells += `<div class="cal-day pad"></div>`;
  for(let d=1; d<=daysInMonth; d++){

    cells += `<div class="cal-day ${isToday?'today':''} ${isSel?'selected':''}" data-date="${ds}">
      <span>${d}</span>${dayHasTx.has(ds)?'<span class="cal-dot"></span>':''}

    <div class="glass" style="padding:16px;">

// 画像を長辺1024pxまで縮小してBase64化（API送信量を抑えるため）
function fileToResizedBase64(file){
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onload = () => {
      const img = new Image();
      img.onload = () => {
        const maxSide = 1024;
        let {width, height} = img;
        if(width > maxSide || height > maxSide){
          const scale = maxSide / Math.max(width, height);
          width = Math.round(width*scale); height = Math.round(height*scale);
        }
        const canvas = document.createElement("canvas");
        canvas.width = width; canvas.height = height;
        canvas.getContext("2d").drawImage(img, 0, 0, width, height);
        const dataUrl = canvas.toDataURL("image/jpeg", 0.85);
        resolve(dataUrl.split(",")[1]);
      };
      img.onerror = () => reject(new Error("画像を読み込めませんでした"));
      img.src = reader.result;
    };
    reader.onerror = () => reject(new Error("ファイルを読み込めませんでした"));
    reader.readAsDataURL(file);
  });
}

async function scanReceipt(file){
  setReceiptScanLoading(true);
  try{
    const base64 = await fileToResizedBase64(file);
    const catIds = EXPENSE_CATS.map(c=>c.id).join(", ");
    const systemPrompt =
      `あなたはレシート画像から支出情報を抽出するアシスタントです。` +
      `次のカテゴリIDの中から最も適切なものを1つ選んでください: ${catIds}。` +
      `必ず次のJSON形式のみを出力し、説明文やコードブロックの記号は一切含めないでください。` +
      `{"amount": 支払い合計金額(税込・数値のみ), "category": "カテゴリID", "date": "YYYY-MM-DD形式のレシート記載日付。読み取れなければ空文字", "memo": "店名や商品名など20文字以内の短い説明", "found": true または false(レシートとして認識できたかどうか)}`;

    const response = await fetch("https://api.anthropic.com/v1/messages", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        model: "claude-sonnet-4-6",
        max_tokens: 1000,
        system: systemPrompt,
        messages: [{
          role: "user",
          content: [
            { type: "image", source: { type: "base64", media_type: "image/jpeg", data: base64 } },
            { type: "text", text: "このレシート画像から支出情報を抽出し、指定のJSON形式のみで答えてください。" }
          ]
        }]
      })
    });

    if(!response.ok) throw new Error("API呼び出しに失敗しました");
    const data = await response.json();
    const textBlock = (data.content||[]).find(b=>b.type==="text");
    if(!textBlock) throw new Error("読み取り結果を取得できませんでした");

    const cleaned = textBlock.text.replace(/```json|```/g, "").trim();
    const result = JSON.parse(cleaned);

    if(result.found === false){
      toast("レシートを認識できませんでした。手入力してください", "warn");
      return;
    }

    // フォームへ反映（種別は支出に固定）
    editingCategoryType = 'expense';
    setSeg('expense');
    const validCat = EXPENSE_CATS.some(c=>c.id===result.category) ? result.category : 'other';
    selectedCatId = validCat;
    const validDate = /^\d{4}-\d{2}-\d{2}$/.test(result.date||"") ? result.date : todayStr();
    buildTxForm({
      amount: Math.round(Number(result.amount)) || "",
      category: validCat,
      memo: (result.memo||"").slice(0,40),
      date: validDate
    });
    toast("レシートを読み取りました。内容を確認してください", "success");
  } catch(err){
    console.error("レシート読み取りエラー", err);
    toast("レシートを読み取れませんでした。手入力してください", "danger");
  } finally {
    setReceiptScanLoading(false);
  }
}

function renderCompareChart(){
  destroyChart('compare');
  const months = lastNMonths(6);
  const exp = months.map(mk => txs.filter(t=>t.type==='expense' && monthKey(t.date)===mk).reduce((s,t)=>s+t.amount,0));
  const inc = months.map(mk => {
    const extra = txs.filter(t=>t.type==='income' && monthKey(t.date)===mk).reduce((s,t)=>s+t.amount,0);
    return extra + (mk===thisMonthKey()? settings.monthlyAllowance : (history.find(h=>h.month===mk)? settings.monthlyAllowance : 0));
  });
  const cc = chartColors();
  charts.compare = new Chart($("#chartCompare"), { type:'line',
    data:{ labels: months.map(m=>m.slice(5)+"月"), datasets:[
      { label:'収入', data:inc, borderColor:'#2FBE71', backgroundColor:'rgba(47,190,113,.15)', tension:.35, fill:true },
      { label:'支出', data:exp, borderColor:'#FF5A5F', backgroundColor:'rgba(255,90,95,.12)', tension:.35, fill:true },
    ]},
    options:{ responsive:true, maintainAspectRatio:false, plugins:{legend:{position:'bottom', labels:{color:cc.text, font:{size:11}}}}, scales:{ x:{ ticks:{color:cc.text}, grid:{display:false} }, y:{ ticks:{color:cc.text}, grid:{color:cc.grid} } } } });
}
function lastNMonths(n){
  const out = [];
  const now = new Date();
  for(let i=n-1;i>=0;i--){
    const d = new Date(now.getFullYear(), now.getMonth()-i, 1);
    out.push(`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`);
  }
  return out;
}

/* CSV 出力 */
function exportCSV(){
  const rows = [["日付","種別","カテゴリ/内容","金額","メモ"]];
  [...txs].sort((a,b)=>a.date.localeCompare(b.date)).forEach(t=>{
    rows.push([t.date, t.type==='expense'?'支出':'収入', catInfo(t.type,t.category).label, t.amount, (t.memo||"").replace(/[\r\n,]/g," ")]);
  });
  const csv = "\uFEFF"+rows.map(r=>r.map(v=>`"${String(v).replace(/"/g,'""')}"`).join(",")).join("\r\n");
  downloadFile(csv, `moneynest_${todayStr()}.csv`, "text/csv;charset=utf-8;");
  toast("CSVを出力しました", "success");
}
function downloadFile(content, filename, mime){
  const blob = new Blob([content], {type:mime});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = filename; document.body.appendChild(a); a.click();
  document.body.removeChild(a); URL.revokeObjectURL(url);
}

      toast(`毎月${settings.autoAllowanceDay}日に${yen(settings.autoAllowanceAmount)}円がお小遣いとして自動登録されます。`, "success");
    } else {
      toast("自動入金をOFFにしました", "info");
    }
    checkAutoAllowance();
    renderHome();
  });

  $("#saveMonthlyGoalBtn").addEventListener("click", ()=>{
    settings.monthlyGoalEnabled = $("#set_monthlyGoalEnabled").checked;
    settings.monthlyGoalAmount = Math.max(0, Number($("#set_monthlyGoalAmount").value)||0);
    save(KEYS.settings, settings);
    if(settings.monthlyGoalEnabled && settings.monthlyGoalAmount>0){
      toast(`毎月${yen(settings.monthlyGoalAmount)}円を目標に貯金します。`, "success");
    } else {
      toast("毎月の貯金目標をOFFにしました", "info");
    }
    renderHome();
  });

  $("#set_dark").addEventListener("change", (e)=>{ settings.darkMode = e.target.checked; applyDarkMode(); save(KEYS.settings, settings); if(currentTab==='charts') renderChartsPage(); });

  $("#set_cookie").addEventListener("change", (e)=>{
    if(e.target.checked){
      // 拒否 → 許可：現在のメモリ上のデータをLocalStorageへ保存開始
      cookieConsent = "granted";
      localStorage.setItem(KEYS.consent, "granted");
      save(KEYS.settings, settings); save(KEYS.tx, txs); save(KEYS.history, history); save(KEYS.meta, meta);
      toast("Cookieを許可しました。データが保存されます", "success");
      renderSettingsPage();
    } else {
      // 許可 → 拒否：保存済みデータを削除するか確認
      const ok = confirm("Cookieの使用を拒否すると、保存されているデータはすべて削除されます。よろしいですか？");
      if(!ok){ e.target.checked = true; return; }
      cookieConsent = "denied";
      [KEYS.settings, KEYS.tx, KEYS.history, KEYS.meta].forEach(k=>localStorage.removeItem(k));
      localStorage.setItem(KEYS.consent, "denied");
      toast("Cookieを拒否しました。データは保存されません", "warn");
      renderSettingsPage();
    }
  });

  $("#exportJsonRow").addEventListener("click", ()=>{
    const dump = {settings, transactions:txs, history, meta};
    downloadFile(JSON.stringify(dump, null, 2), `moneynest_backup_${todayStr()}.json`, "application/json");
    toast("データをエクスポートしました", "success");
  });
  $("#exportCsvRow").addEventListener("click", exportCSV);
  $("#importJsonRow").addEventListener("click", ()=> $("#importFileInput").click());
  $("#importFileInput").addEventListener("change", (e)=>{
    const file = e.target.files[0]; if(!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      try{
        const data = JSON.parse(reader.result);
        if(data.settings) settings = data.settings;
        if(data.transactions) txs = data.transactions;
        if(data.history) history = data.history;
        if(data.meta) meta = data.meta;
        save(KEYS.settings, settings); save(KEYS.tx, txs); save(KEYS.history, history); save(KEYS.meta, meta);
        applyDarkMode();
        toast("データを読み込みました", "success");
        renderAll();
      }catch(err){ toast("ファイルを読み込めませんでした", "danger"); }
    };
    reader.readAsText(file);
  });
  $("#updateInfoRow").addEventListener("click", openUpdateModal);
  $("#faqRow").addEventListener("click", openFaqModal);
  $("#contactRow").addEventListener("click", openContactModal);
  $("#appRefreshRow").addEventListener("click", async ()=>{
    $("#appRefreshIcon").textContent = "⏳";
    toast("最新の状態を確認しています…", "info", 1600);
    try{
      if('serviceWorker' in navigator){
        const regs = await navigator.serviceWorker.getRegistrations();
        await Promise.all(regs.map(reg => reg.update().catch(()=>{})));
      }
      if(window.caches && caches.keys){
        const keys = await caches.keys();
        await Promise.all(keys.map(k => caches.delete(k)));
      }
    } catch(e){ console.error("更新確認エラー", e); }
    setTimeout(()=> location.reload(), 500);
  });
  $("#deleteAllRow").addEventListener("click", ()=>{
    if(confirm("すべてのデータを削除します。この操作は取り消せません。よろしいですか？")){
      Object.values(KEYS).forEach(k=>localStorage.removeItem(k));
      location.reload();
    }
  });
}

// Googleスプレッドシートへ送信するためのGoogle Apps Script（Webアプリ）のURL
// 設定方法は同梱の SPREADSHEET_SETUP.md を参照してください
const SHEET_ENDPOINT_URL = "https://script.google.com/macros/s/AKfycbzJgx_B0p2NIJdwB1tzgFPwP1Kpt1JGqElkNAQ97_aVLsbmJZ3SMKiz96gRvgnQQOnsRQ/exec";

// スプレッドシートへ1件分のデータを送信する
async function submitToSheet(payload){
  if(!SHEET_ENDPOINT_URL || SHEET_ENDPOINT_URL.includes("YOUR_DEPLOYMENT_ID")){
    toast("送信先が未設定です。SPREADSHEET_SETUP.mdをご確認ください", "danger", 5000);
    return false;
  }
  try{
    // Google Apps Script Webアプリはno-corsでの送信が基本パターン（応答は読めないが送信自体は行われる）
    await fetch(SHEET_ENDPOINT_URL, {
      method: "POST",
      mode: "no-cors",
      headers: { "Content-Type": "text/plain;charset=utf-8" }, // シンプルリクエストにしてpreflightを回避
      body: JSON.stringify(payload)
    });
    return true;
  }catch(err){
    console.error("スプレッドシートへの送信エラー", err);
    return false;
  }
}

      <div class="field"><label>返信用メールアドレス（任意）</label><input id="ct_email" type="email" placeholder="例：hanako@example.com" maxlength="100"><div style="font-size:11px; color:var(--text-faint); margin-top:6px;">返信が必要な場合のみご記入ください</div></div>

      </div>
      <div class="field"><label>お問い合わせ内容</label><textarea id="ct_message" rows="5" placeholder="内容を入力してください" maxlength="1000"></textarea></div>
      <button class="btn btn-primary" id="contactSendBtn">送信する</button>
    `;
  } else if(contactStep === "feature"){
    $("#contactModalBody").innerHTML = `
      ${backButtonHtml()}
      <div class="field"><label>お名前（任意）</label><input id="ct_name" type="text" placeholder="例：はなこ" maxlength="20"></div>
      <div class="field"><label>返信用メールアドレス（任意）</label><input id="ct_email" type="email" placeholder="例：hanako@example.com" maxlength="100"><div style="font-size:11px; color:var(--text-faint); margin-top:6px;">返信が必要な場合のみご記入ください</div></div>
      <div class="field"><label>希望する機能名</label><input id="ct_featureName" type="text" placeholder="例：予算アラート機能" maxlength="60"></div>
      <div class="field"><label>どの画面で使いたい機能ですか？</label>
        <select id="ct_screen">
          <option>ホーム画面</option>
          <option>収入・支出入力</option>
          <option>履歴</option>
          <option>設定</option>
          <option>その他</option>
        </select>
      </div>
      <div class="field"><label>その機能が必要な理由を教えてください</label><textarea id="ct_reason" rows="3" placeholder="例：今の使い方だとこう困っている、など" maxlength="500"></textarea></div>
      <div class="field"><label>どのような動作を希望しますか？</label><textarea id="ct_behavior" rows="3" placeholder="例：こういうときにこう動いてほしい、など" maxlength="500"></textarea></div>
      <div class="field"><label>その他ご要望（任意）</label><textarea id="ct_more" rows="2" placeholder="自由にご記入ください" maxlength="500"></textarea></div>
      <button class="btn btn-primary" id="contactSendBtn">送信する</button>

  } else if(contactStep === "bug"){

async function submitContactForm(){
  const name = $("#ct_name").value.trim() || "匿名";
  const email = $("#ct_email").value.trim();
  if(email && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)){
    toast("メールアドレスの形式が正しくありません", "warn"); return;
  }
  let type = "", answers = {};

  if(contactStep === "inquiry"){
    const category = $("#ct_category").value;
    const message = $("#ct_message").value.trim();
    if(!message){ toast("お問い合わせ内容を入力してください", "warn"); return; }
    type = "お問い合わせ";
    answers = { "お問い合わせの種類":category, "お問い合わせ内容":message };
  } else if(contactStep === "feature"){
    const featureName = $("#ct_featureName").value.trim();
    const screen = $("#ct_screen").value;
    const reason = $("#ct_reason").value.trim();
    const behavior = $("#ct_behavior").value.trim();
    const more = $("#ct_more").value.trim();
    if(!featureName){ toast("希望する機能名を入力してください", "warn"); return; }
    if(!reason){ toast("必要な理由を入力してください", "warn"); return; }
    if(!behavior){ toast("希望する動作を入力してください", "warn"); return; }
    type = "機能追加リクエスト";
    answers = {
      "希望する機能名":featureName, "使いたい画面":screen,
      "必要な理由":reason, "希望する動作":behavior, "その他ご要望":more||"（なし）",
    };
  } else if(contactStep === "bug"){
    const screen = $("#ct_bugScreen").value;
    const desc = $("#ct_bugDesc").value.trim();
    const steps = $("#ct_bugSteps").value.trim();
    const device = $("#ct_device").value;
    const browser = $("#ct_browser").value;
    const screenshotFile = $("#ct_screenshot").files[0];
    const stillHappens = $("#ct_stillHappens").value;
    if(!desc){ toast("発生した不具合を入力してください", "warn"); return; }
    if(!steps){ toast("発生する手順を入力してください", "warn"); return; }
    type = "不具合報告";
    answers = {
      "発生した画面":screen, "発生した不具合":desc, "発生する手順":steps,
      "利用端末":device, "利用ブラウザ":browser,
      "現在も発生しているか":stillHappens,
      "スクリーンショットファイル名": screenshotFile ? screenshotFile.name : "（なし）",
    };
  }

  const payload = {
    種別: type,
    お名前: name,
    返信用メールアドレス: email || "（返信不要）",
    送信日時: new Date().toLocaleString('ja-JP'),
    ...answers,
  };

  const btn = $("#contactSendBtn");
  const originalLabel = btn.textContent;
  btn.disabled = true; btn.style.opacity = "0.6"; btn.textContent = "送信中…";

  const ok = await submitToSheet(payload);

  btn.disabled = false; btn.style.opacity = "1"; btn.textContent = originalLabel;

  if(ok){
    toast("送信しました。ありがとうございます！", "success");
    $("#contactModal").classList.add("hidden");
  } else if(SHEET_ENDPOINT_URL && !SHEET_ENDPOINT_URL.includes("YOUR_DEPLOYMENT_ID")){
    toast("送信に失敗しました。通信環境をご確認のうえ、もう一度お試しください", "danger");
  }
}
